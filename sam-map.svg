      <text x="873" y="143">History</text>
      <text x="1059" y="252">Personal</text><text x="1059" y="278">details</text>
      <text x="1100" y="424">Projects</text>
      <text x="982" y="557">Remember</text><text x="982" y="583">when</text>
      <text x="742" y="656">Recall</text>
      <text x="458" y="628">Create</text><text x="458" y="650" font-size="13" font-weight="400" fill="#94a3b8">notes /</text><text x="458" y="666" font-size="13" font-weight="400" fill="#94a3b8">spreadsheets /</text><text x="458" y="682" font-size="13" font-weight="400" fill="#94a3b8">presentations</text>
