    <text x="1292" y="215" font-size="30" font-weight="700" fill="#e2e8f0">Off the shelf</text>
    <text x="1292" y="251" font-size="23" fill="#94a3b8">Ready to plug in.</text>
    <circle cx="1265" cy="326" r="9" fill="#38bdf8"/>
    <text x="1292" y="335" font-size="30" font-weight="700" fill="#e2e8f0">No programming</text>
    <text x="1292" y="371" font-size="23" fill="#94a3b8">Just answer a few set-up questions.</text>
    <circle cx="1265" cy="446" r="9" fill="#38bdf8"/>
    <text x="1292" y="455" font-size="30" font-weight="700" fill="#e2e8f0">Small box</text>
    <text x="1292" y="491" font-size="23" fill="#94a3b8">Place it anywhere. Works on wifi.</text>
    <circle cx="1265" cy="566" r="9" fill="#38bdf8"/>
    <text x="1292" y="575" font-size="30" font-weight="700" fill="#e2e8f0">At home</text>
    <text x="1292" y="611" font-size="23" fill="#94a3b8">Your memory lives on your</text>
    <text x="1292" y="641" font-size="23" fill="#94a3b8">own unit, in your home.</text>
    <circle cx="1265" cy="705" r="9" fill="#38bdf8"/>
    <text x="1292" y="714" font-size="30" font-weight="700" fill="#e2e8f0">Contact</text>
    <text x="1292" y="750" font-size="23" fill="#94a3b8">Scan with your phone camera.</text>
