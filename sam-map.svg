    <text x="1292" y="215" font-size="30" font-weight="700" fill="#e2e8f0">Off the shelf</text>
    <text x="1292" y="251" font-size="23" fill="#94a3b8">Ready to plug in.</text>
    <circle cx="1265" cy="311" r="9" fill="#38bdf8"/>
    <text x="1292" y="320" font-size="30" font-weight="700" fill="#e2e8f0">No programming</text>
    <text x="1292" y="356" font-size="23" fill="#94a3b8">Just answer a few set-up questions.</text>
    <circle cx="1265" cy="416" r="9" fill="#38bdf8"/>
    <text x="1292" y="425" font-size="30" font-weight="700" fill="#e2e8f0">Small box</text>
    <text x="1292" y="461" font-size="23" fill="#94a3b8">Place it anywhere. Works on wifi.</text>
    <circle cx="1265" cy="521" r="9" fill="#38bdf8"/>
